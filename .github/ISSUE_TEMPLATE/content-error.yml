name: Content error
description: Something in the course is wrong, outdated or unclear
labels: [content]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Module and section, or paste what the Copy button gives you
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
      description: Include a link to Convex docs or source if you have one
    validations:
      required: true
